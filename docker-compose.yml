services:
  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-m", "8222"]

  python-sidecar:
    build:
      context: ./python-sidecar
    ports:
      - "8001:8001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
