services:
  mariadb:
    image: mariadb:10.11
    ports:
      - "3307:3306"
    environment:
      MARIADB_DATABASE: portal
      MARIADB_USER: portal
      MARIADB_PASSWORD: portal
      MARIADB_ROOT_PASSWORD: portal-root
    volumes:
      - mariadb-10-data:/var/lib/mysql

  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-m", "8222"]

  python-sidecar:
    build:
      context: ./python-sidecar
    ports:
      - "8001:8001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  mariadb-10-data:
